<!doctype html>
<html lang="pt-BR"><head><link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>Dispositivos de texto — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
<style>
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--font-institucional)}
.row{display:flex;gap:var(--space-10);padding:var(--space-6);align-items:center;flex-wrap:wrap}
.carimbo{border:3px solid var(--cobalto);color:var(--cobalto);padding:var(--space-2) var(--space-4);font-size:13px;line-height:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg);text-align:center;border-radius:var(--radius-etiqueta)}
.carimbo small{display:block;font-size:10px;letter-spacing:.2em;font-weight:500;margin-top:var(--space-1)}
.tag{position:relative;background:var(--tomate);color:var(--on-tomate);width:200px;padding:var(--space-4) var(--space-4) var(--space-4) 44px;border-radius:var(--radius-etiqueta);clip-path:polygon(24px 0,100% 0,100% 100%,24px 100%,0 50%)}
.tag:before{content:"";position:absolute;left:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:var(--radius-pill);background:var(--papel)}
.tag .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tag .v{font-family:var(--font-editorial);font-size:19px;line-height:24px}
.leg{border-top:1px solid var(--tinta);padding-top:var(--space-2);width:220px}
.leg .t{font-family:var(--font-editorial);font-weight:600;font-size:17px}
.leg .m{font-size:12px;line-height:16px;font-weight:500;color:var(--tinta-suave)}
</style></head><body>
<div class="row">
 <div class="carimbo">Departamento de<br>Assuntos Não Urgentes<small>Fechado para balanço interno</small></div>
 <div class="tag"><div class="k">Destino</div><div class="v">Lugar nenhum, sem pressa</div></div>
 <div class="leg"><div class="m">Nº 07 · Temporada 01</div><div class="t">Leva casaco para Salvador</div><div class="m">Algodão sobre pessoa, 2026.</div></div>
</div>
</body></html>
